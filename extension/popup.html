<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastisk Clipper</title>
  <style>
    :root {
      --bg: #ffffff; --text: #18181b; --text-soft: #71717a;
      --border: #e4e4e7; --accent: #6366f1; --bg-soft: #f5f5f7;
      --ok: #059669; --err: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181b; --text: #f4f4f5; --text-soft: #a1a1aa;
        --border: #333338; --accent: #818cf8; --bg-soft: #232326;
        --ok: #34d399; --err: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 260px; margin: 0; padding: 14px;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }
    .head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .brand { font-weight: 700; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #a1a1aa; }
    .dot.online { background: var(--ok); }
    .dot.offline { background: var(--err); }
    .status { font-size: 11.5px; color: var(--text-soft); margin-left: auto; }
    button.action {
      display: block; width: 100%; margin-bottom: 8px;
      padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px;
      background: var(--bg-soft); color: var(--text); font-size: 13.5px;
      cursor: pointer; text-align: left;
    }
    button.action:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .footer { margin-top: 8px; text-align: right; }
    .footer a { color: var(--text-soft); font-size: 12px; text-decoration: none; }
    .footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="head">
    <span class="brand">Mastisk</span>
    <span id="dot" class="dot"></span>
    <span id="status" class="status">…</span>
  </div>
  <button id="send-page" class="action primary">Send this page</button>
  <button id="open-chat" class="action">Open chat</button>
  <div class="footer">
    <a id="open-options" href="#">Settings</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
