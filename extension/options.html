<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastisk Clipper — Settings</title>
  <style>
    :root {
      --bg: #ffffff; --text: #18181b; --text-soft: #71717a;
      --border: #e4e4e7; --accent: #6366f1; --bg-soft: #f5f5f7;
      --ok: #059669; --err: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181b; --text: #f4f4f5; --text-soft: #a1a1aa;
        --border: #333338; --accent: #818cf8; --bg-soft: #232326;
        --ok: #34d399; --err: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      max-width: 520px; margin: 40px auto; padding: 0 20px;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.5;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--text-soft); margin: 0 0 24px; font-size: 13px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    .hint { color: var(--text-soft); font-size: 12px; font-weight: 400; }
    input[type="text"] {
      width: 100%; padding: 9px 11px; border: 1px solid var(--border);
      border-radius: 9px; background: var(--bg-soft); color: var(--text);
      font-size: 14px; font-family: inherit; outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
    button {
      padding: 9px 14px; border: 1px solid var(--border); border-radius: 9px;
      background: var(--bg-soft); color: var(--text); font-size: 13.5px; cursor: pointer;
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button:hover { border-color: var(--accent); }
    #msg { margin-left: auto; font-size: 12.5px; }
    #msg.ok { color: var(--ok); }
    #msg.err { color: var(--err); }
  </style>
</head>
<body>
  <h1>Mastisk Clipper</h1>
  <p class="sub">Point the clipper at your local Mastisk daemon.</p>

  <label for="server-url">Server URL
    <span class="hint">— e.g. http://localhost:5555 or a Tailnet address</span>
  </label>
  <input type="text" id="server-url" placeholder="http://localhost:5555" spellcheck="false" autocomplete="off">

  <div class="row">
    <button id="save" class="primary">Save</button>
    <button id="test">Test connection</button>
    <span id="msg"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
