[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mastisk"
version = "0.1.0"
description = "Personal knowledge wiki with 24/7 research agents, powered by Claude Code + Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mastisk contributors" }]
keywords = ["knowledge-wiki", "agents", "claude", "ollama", "pwa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "typer>=0.15",
  "rich>=13.9",
  "httpx>=0.28",
  "feedparser>=6.0",
  "trafilatura>=1.12",
  "apscheduler>=3.10",
  "python-dotenv>=1.0",
  "sse-starlette>=2.1",
  "markdown-it-py>=3.0",
  "python-slugify>=8.0",
  "aiosqlite>=0.20",
  "yt-dlp>=2025.1.15",
  "pyyaml>=6.0",
  "tomli-w>=1.0",
  "python-multipart>=0.0.20",
  "fsrs>=6.0",
]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.6"]
audio = ["mlx-whisper>=0.4"]
ingest = ["markitdown[pdf,docx,pptx,xlsx]>=0.1.6"]
dev = ["ruff>=0.7", "pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
mastisk = "mastisk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mastisk"]

[tool.hatch.build.targets.wheel.force-include]
"src/mastisk/pwa" = "mastisk/pwa"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
